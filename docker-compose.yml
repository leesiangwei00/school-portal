services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_portal
      POSTGRES_PASSWORD: school_portal
      POSTGRES_DB: school_portal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
